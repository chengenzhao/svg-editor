# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'liberica'
        java-package: jdk+fx
        cache: maven

#    - name: Install WiX Toolset (Windows)
#      if: matrix.os == 'windows-latest'
#      run: dotnet tool install --global WiX

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: jpackage build Windows exe
      shell: pwsh
      run: |
        jpackage `
          --type exe `
          --name "SVGEditor" `
          --app‑version "1.1.0" `
          --module com.whitewoodcity.svgeditor/com.whitewoodcity.svgeditor.SVGEditor `
          --module‑path target/classes `
          --dest ./output `
          --win‑dir‑chooser `
          --win‑shortcut

#    - name: Generate Installer with jpackage
#      run: jpackage --input target/ --name "SVGEditor" --main-jar "svg-editor.jar" --main-class "com.whitewoodcity.svgeditor.SVGEditor" --type msi --dest output/ --app-version "1.1.0" --vendor "White Wood City"

    - uses: actions/upload-artifact@v7
      with:
        name: win-build
        path: output/*
        retention-days: 1
